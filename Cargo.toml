[package]
authors = ["Bob Gardner <bob.hn.gardner@gmail.com>"]
build = "build.rs"
description = "Command line shell"
edition = "2024"
license = "MIT or Apache-2.0"
name = "bsh"
readme = "README.md"
version = "0.1.0"

[build-dependencies]
lalrpop = "0.23.1"

[dependencies]
cfg-if = "1.0.4"
dirs = "6.0.0"
docopt = "1.1.1"
failure = "0.1.8"
fern = "0.7.1"
lalrpop-util = "0.23.1"
libc = "0.2.102"
log = "0.4.32"
nix = "0.22.1"
regex = "1.12.3"
rustyline = "9.0.0"
serde = "1.0.228"
serde_derive = "1.0.228"

[dev-dependencies]
assert_cmd = "2.2.2"
chrono = "0.4.45"
escargot = "0.5.15"
predicates = "3.1.4"
tempfile = "3.27.0"
